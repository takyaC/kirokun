# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

title: きろくん
description: 筋トレ、学習、日々の習慣を数タップで記録。テンプレートと振り返りで、続けることをやさしく支える活動記録アプリです。
baseurl: "/kirokun"
url: "https://takyac.github.io"
og_image: /assets/img/app-icon.jpg

# Aptabase App Key for this website (example: A-US-0000000000)
# Leave empty to disable analytics.
aptabase_app_key:

header:
  pages:
    - name: ホーム
      slug: /
    - name: プライバシーポリシー
      slug: /privacy-policy

footer:
  show_powered_by: false
  contact:
    - type: email
      name: Google Form
      link: https://forms.gle/Hmwoe6g7VwKe4Jkb7
# Build settings
markdown: kramdown
sass:
  style: :compressed
plugins:
  - jekyll-feed

# Excluded items
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - feed.xml
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Used for defeating caching
version: 3
